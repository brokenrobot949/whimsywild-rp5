<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Whimsywild RP5</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./css/style.css">
  <script>
    // Shows errors on the page instead of leaving it blank, which helps after editing a data file.
    (function () {
      function show(message) {
        var box = document.getElementById('error');
        if (!box) {
          document.addEventListener('DOMContentLoaded', function () { show(message); });
          return;
        }
        if (!box.hidden) return; // keep the first error, which is usually the cause
        box.textContent = 'Something went wrong:\n' + message;
        box.hidden = false;
      }
      window.showStartupError = show;
      window.addEventListener('error', function (event) {
        var where = event.filename ? '\n(' + event.filename.replace(location.origin, '') + ', line ' + event.lineno + ')' : '';
        show(((event.error && event.error.message) || event.message) + where);
      });
      window.addEventListener('unhandledrejection', function (event) {
        show(String((event.reason && event.reason.message) || event.reason));
      });
    })();
  </script>
  <script type="module" src="./js/main.js" onerror="showStartupError('A game file could not be loaded. Press F12 and look in the Console to see which one.')"></script>
</head>
<body>
  <main id="app">
    <section id="map-pane">
      <canvas id="map" aria-label="World map"></canvas>
    </section>
    <section id="side">
      <header id="hero-strip">
        <div id="hero-name"></div>
        <div id="hero-facts">Level <b id="hero-level"></b> · Age <b id="hero-age"></b> · <span id="hero-season"></span></div>
        <div id="hero-status"></div>
      </header>
      <ol id="log"></ol>
      <div id="card-layer" hidden>
        <div class="card" role="dialog" aria-labelledby="card-title">
          <h2 id="card-title"></h2>
          <p id="card-body"></p>
          <button type="button" id="card-button"></button>
        </div>
      </div>
    </section>
  </main>
  <details id="debug" hidden></details>
  <div id="error" role="alert" hidden></div>
</body>
</html>
